name: Release-plz PR

on:
    push:
        branches:
            - master
    workflow_dispatch: {}

# Prevent concurrent runs from creating duplicate or conflicting PRs.
concurrency:
    group: release-plz-pr-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            # Generating a GitHub token so that PRs created by release-plz
            # can trigger downstream workflows.
            - name: Generate GitHub token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              id: generate-token
              with:
                  app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0
                  token: ${{ steps.generate-token.outputs.token }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

            - name: Run release-plz
              uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
