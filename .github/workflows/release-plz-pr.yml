name: Release-plz PR

on:
    push:
        branches:
            - master

# Prevent concurrent runs from creating duplicate or conflicting PRs.
concurrency:
    group: release-plz-pr-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            # Generating a GitHub token so that PRs created by release-plz
            # can trigger downstream workflows.
            - name: Generate GitHub token
              uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
              id: generate-token
              with:
                  app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.generate-token.outputs.token }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Run release-plz
              uses: release-plz/action@2d634174257b7f46339e7533865a910743a0c5c9 # v0.5
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
